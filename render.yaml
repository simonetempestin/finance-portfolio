services:
  - type: web
    name: finance-toolkit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://simonetempestin!.github.io
      - key: PYTHON_VERSION
        value: 3.12.7
